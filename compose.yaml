name: AI-interview

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interview}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}

    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      - --performance-schema=OFF

    mem_limit: ${MYSQL_MEM_LIMIT:-512m}

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping
          -h 127.0.0.1
          -uroot
          --password="$${MYSQL_ROOT_PASSWORD}"
          --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - app_net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru

    mem_limit: ${REDIS_MEM_LIMIT:-96m}

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RESUME_UPLOAD_DIR: /app/backend/uploads
    volumes:
      - resume_uploads:/app/backend/uploads
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-64m}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

volumes:
  mysql_data:
    name: interview_mysql_data

  redis_data:
    name: interview_redis_data

  resume_uploads:
    name: interview_resume_uploads

networks:
  app_net:
    name: interview_net
    driver: bridge